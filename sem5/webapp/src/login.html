<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="script.js"></script>
  <link rel="stylesheet" href="style.css">
  <title>Login</title>
</head>
<body>
  <div class="form-div" id="login-div">
    <h1 class="form-header">Login</h1>
    <form id="login-form">
      <div class="username-div">
        <label for="username-login">Username:</label><br>
        <input type="text" id="username-login" class="username" name="username" placeholder="Username"><br>
      </div>
      <div class="passwd-div">
        <label for="passwd-login">Password:</label><br>
        <input type="password" id="passwd-login" class="passwd" name="passwd" placeholder="Password"><br>
      </div>
    </form>
  </div>
</body>
</html>
