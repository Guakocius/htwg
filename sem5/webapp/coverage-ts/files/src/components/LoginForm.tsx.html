import React, { useState } from &quot;react&quot;;

import type { FormProps } from &quot;../types.ts&quot;;

export default function LoginForm({ form }: FormProps) {
  const [values, setValues] = useState({
    userName: &quot;&quot;,
    password: &quot;&quot;,
  });

  const handleInputChange = (event: React.ChangeEvent&lt;HTMLInputElement&gt;) =&gt; {
    event.preventDefault();

    const { name, value } = event.target as HTMLInputElement;
    setValues((values) =&gt; ({
      ...values,
      [name]: value,
    }));
  };

  const [submitted, setSubmitted] = useState(false);
  const [valid, setValid] = useState(false);

  const handleSubmit = (e: React.SubmitEvent&lt;HTMLFormElement&gt;) =&gt; {
    e.preventDefault();
    if (values.userName &amp;&amp; values.password) {
      setValid(true);
    }
    setSubmitted(true);
    return e;
  };

  const h3 =
    form === &quot;Register&quot; ? (
      &lt;h3&gt;Registered successfully&lt;/h3&gt;
    ) : form === &quot;Login&quot; ? (
      &lt;h3&gt;Login successful&lt;/h3&gt;
    ) : (
      &lt;h3&gt;{&quot;&quot;}&lt;/h3&gt;
    );

  return (
    &lt;&gt;
      &lt;div className=&quot;form-container&quot;&gt;
        &lt;h1 className=&quot;form-header&quot;&gt;{form}&lt;/h1&gt;
        &lt;form id=&quot;register-form&quot; onSubmit={handleSubmit}&gt;
          {submitted &amp;&amp; valid &amp;&amp; &lt;div className=&quot;form-success&quot;&gt;{h3}&lt;/div&gt;}
          {!valid &amp;&amp; (
            &lt;div className=&quot;username-div&quot;&gt;
              &lt;label htmlFor=&quot;username&quot;&gt;Username:&lt;/label&gt;
              &lt;input
                type=&quot;text&quot;
                className=&quot;username&quot;
                name=&quot;username&quot;
                placeholder=&quot;Username&quot;
                value={values.userName}
                onChange={handleInputChange}
              /&gt;
            &lt;/div&gt;
          )}

          {submitted &amp;&amp; !values.userName &amp;&amp; (
            &lt;h3 id=&quot;user-name-error&quot;&gt;Please enter a user name&lt;/h3&gt;
          )}

          {!valid &amp;&amp; (
            &lt;div className=&quot;password-div&quot;&gt;
              &lt;label htmlFor=&quot;password&quot;&gt;Password:&lt;/label&gt;
              &lt;input
                type=&quot;password&quot;
                className=&quot;password&quot;
                name=&quot;password&quot;
                placeholder=&quot;Password&quot;
                value={values.password}
                onChange={handleInputChange}
              /&gt;
              &lt;br /&gt;
            &lt;/div&gt;
          )}

          {!valid &amp;&amp; &lt;button type=&quot;submit&quot;&gt;{form}&lt;/button&gt;}
        &lt;/form&gt;
      &lt;/div&gt;
    &lt;/&gt;
  );
}
