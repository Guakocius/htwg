[package]
name = "group_chat"
version = "0.1.0"
edition = "2024"

[dependencies]
llvm-tools = "0.1.1"
regex = "1.12.3"
tokio = { version = "1.52.3", features = ["full"] }

[[bin]]
name = "server"
path = "src/bin/server_main.rs"

[[bin]]
name = "client"
path = "src/bin/client_main.rs"

[lib]
name = "group_chat"
path = "src/lib.rs"
